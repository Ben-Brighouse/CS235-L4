<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/main.css">
    <title>Browse Tracks</title>
</head>
<body>

    {% include 'navbar.html' %}

<div class="main-content">

    {% include 'content_header.html' %}

      <div class="tracklist">
          {% for track in tracks %}
              <a href="{{ url_for('tracks_bp.simple_track', track_id = track.track_id) }}" style="text-decoration: none; color: inherit;">
              <div class="album">
                <img src="../static/coverart/{{ track.cover_art }}" alt="">
                <p class="albumtitle">{{ track.title }}</p>
                <p class="albumartist">{{ track.artist }}</p>
                </div>
              </a>

          {% endfor %}
      </div>
    </div>
  </div>


</body>
</html>
